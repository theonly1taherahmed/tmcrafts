<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM Runner - Ultimate Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #game-container {
            position: relative;
            width: 900px;
            height: 500px;
            border: 4px solid #f59e0b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6);
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #1e40af, #3b82f6, #60a5fa);
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .coins-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        
        .title {
            font-size: 60px;
            font-weight: 900;
            color: #f59e0b;
            margin-bottom: 25px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .button {
            padding: 16px 40px;
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            color: #1e293b;
            border: none;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px;
            transition: all 0.3s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        .button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        
        .instructions {
            margin-top: 35px;
            text-align: center;
            max-width: 85%;
            line-height: 1.7;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
        }
        
        .game-over {
            font-size: 50px;
            color: #ef4444;
            margin-bottom: 20px;
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
        }
        
        .hidden {
            display: none;
        }
        
        .powerup-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 50px;
        }
        
        .powerup-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .powerup-icon.active {
            border-color: #f59e0b;
            animation: pulse 1s infinite;
            background: rgba(245, 158, 11, 0.2);
        }
        
        .upgrade-notification {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            color: #1e293b;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .upgrade-notification.show {
            opacity: 1;
        }
        
        .high-score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        
        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
            z-index: 15;
            opacity: 0;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @keyframes countdownAnimation {
            0% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        }

        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: center;
            gap: 30px;
            padding: 0 20px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            user-select: none;
        }
        
        @media (max-width: 768px) {
            #game-container {
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
            }
            
            .mobile-controls {
                display: flex;
            }
            
            .title {
                font-size: 40px;
            }
            
            .button {
                padding: 14px 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-overlay">
            <div class="score-display">
                <div>Score: <span id="score">0</span></div>
                <div class="coins-display">
                    <i class="fas fa-coins" style="color: #f59e0b;"></i>
                    <span id="coins">0</span>
                </div>
            </div>
            
            <div class="high-score">
                Best: <span id="high-score">0</span>
            </div>
            
            <div class="powerup-bar">
                <div class="powerup-icon" id="shield-powerup" title="Shield - Protects from one obstacle">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="powerup-icon" id="magnet-powerup" title="Magnet - Attracts coins">
                    <i class="fas fa-magnet"></i>
                </div>
                <div class="powerup-icon" id="rocket-powerup" title="Rocket - Temporary invincibility">
                    <i class="fas fa-rocket"></i>
                </div>
            </div>
            
            <div class="upgrade-notification" id="upgrade-notification"></div>
            
            <div class="countdown" id="countdown">3</div>
            
            <div class="mobile-controls">
                <div class="control-btn" id="jump-btn">
                    <i class="fas fa-arrow-up"></i>
                </div>
            </div>
        </div>
        
        <div id="start-screen" class="screen">
            <h1 class="title">TM RUNNER</h1>
            <button id="start-button" class="button">Start Game</button>
            <div class="instructions">
                <p>Press SPACE, UP ARROW or tap to jump</p>
                <p>Collect coins to buy upgrades and avoid obstacles</p>
                <p>Get the highest score possible!</p>
            </div>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h2 class="game-over">Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <p>Coins collected: <span id="final-coins">0</span></p>
            <p>New high score: <span id="new-high-score">No</span></p>
            <button id="restart-button" class="button">Play Again</button>
            <p id="auto-restart">Restarting in <span id="restart-timer">5</span> seconds</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // عناصر DOM
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const startButton = document.getElementById('start-button');
            const restartButton = document.getElementById('restart-button');
            const scoreDisplay = document.getElementById('score');
            const coinsDisplay = document.getElementById('coins');
            const finalScoreDisplay = document.getElementById('final-score');
            const finalCoinsDisplay = document.getElementById('final-coins');
            const highScoreDisplay = document.getElementById('high-score');
            const newHighScoreDisplay = document.getElementById('new-high-score');
            const restartTimerDisplay = document.getElementById('restart-timer');
            const upgradeNotification = document.getElementById('upgrade-notification');
            const countdown = document.getElementById('countdown');
            const jumpBtn = document.getElementById('jump-btn');
            
            // إعداد Canvas
            canvas.width = 900;
            canvas.height = 500;
            
            // متغيرات اللعبة
            let gameSpeed = 5;
            let score = 0;
            let coins = 0;
            let highScore = parseInt(localStorage.getItem('tmRunnerHighScore') || '0');
            let obstacles = [];
            let clouds = [];
            let coinsList = [];
            let powerups = [];
            let particles = [];
            let gameActive = false;
            let animationId;
            let groundY = canvas.height - 60;
            let autoRestartTimer = null;
            
            // ترقيات اللاعب
            const upgrades = {
                doubleJump: false,
                shield: false,
                magnet: false,
                speed: false,
                magnetRadius: 150
            };
            
            // إعداد اللاعب
            const player = {
                x: 100,
                y: groundY,
                width: 50,
                height: 70,
                velocityY: 0,
                gravity: 0.5,
                jumpStrength: 15,
                isJumping: false,
                jumps: 1,
                maxJumps: 1,
                hasShield: false,
                isInvincible: false,
                invincibilityTimer: 0,
                
                draw() {
                    // تأثير المناعة
                    if (this.isInvincible) {
                        ctx.save();
                        ctx.globalAlpha = 0.7;
                    }
                    
                    // الدرع
                    if (this.hasShield) {
                        ctx.beginPath();
                        ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2 + 15, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
                        ctx.fill();
                        ctx.strokeStyle = '#3b82f6';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                    
                    // جسم اللاعب (شكل أكثر تفصيلاً)
                    ctx.fillStyle = '#8b5cf6';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // تفاصيل اللاعب
                    ctx.fillStyle = '#7c3aed';
                    ctx.fillRect(this.x, this.y, this.width, this.height/3);
                    
                    // العينين
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(this.x + 15, this.y + 15, 8, 0, Math.PI * 2);
                    ctx.arc(this.x + 35, this.y + 15, 8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(this.x + 17, this.y + 15, 4, 0, Math.PI * 2);
                    ctx.arc(this.x + 33, this.y + 15, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // الفم
                    ctx.beginPath();
                    ctx.arc(this.x + 25, this.y + 30, 6, 0, Math.PI);
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    if (this.isInvincible) {
                        ctx.restore();
                    }
                },
                
                update() {
                    // تطبيق الجاذبية
                    this.velocityY += this.gravity;
                    this.y += this.velocityY;
                    
                    // منع اللاعب من النزول تحت الأرض
                    if (this.y > groundY - this.height) {
                        this.y = groundY - this.height;
                        this.velocityY = 0;
                        this.isJumping = false;
                        this.jumps = this.maxJumps;
                    }
                    
                    // تحديث وقت المناعة
                    if (this.isInvincible) {
                        this.invincibilityTimer--;
                        if (this.invincibilityTimer <= 0) {
                            this.isInvincible = false;
                        }
                    }
                },
                
                jump() {
                    if (this.jumps > 0) {
                        this.velocityY = -this.jumpStrength;
                        this.isJumping = true;
                        this.jumps--;
                        
                        // تأثير القفز
                        createParticles(this.x + this.width/2, this.y + this.height, 8, '#f59e0b');
                    }
                },
                
                activateShield() {
                    this.hasShield = true;
                    document.getElementById('shield-powerup').classList.add('active');
                },
                
                activateMagnet() {
                    upgrades.magnet = true;
                    document.getElementById('magnet-powerup').classList.add('active');
                    
                    // تفعيل المغناطيس لمدة 10 ثوان
                    setTimeout(() => {
                        upgrades.magnet = false;
                        document.getElementById('magnet-powerup').classList.remove('active');
                    }, 10000);
                },
                
                activateRocket() {
                    this.isInvincible = true;
                    this.invincibilityTimer = 300;
                    document.getElementById('rocket-powerup').classList.add('active');
                    
                    // تأثير الصاروخ
                    createParticles(this.x + this.width/2, this.y + this.height, 25, '#ef4444');
                    
                    // إزالة التأثير بعد 5 ثوان
                    setTimeout(() => {
                        document.getElementById('rocket-powerup').classList.remove('active');
                    }, 5000);
                }
            };
            
            // صنف العقبات
            class Obstacle {
                constructor() {
                    this.type = Math.random() > 0.7 ? 'high' : (Math.random() > 0.5 ? 'normal' : 'low');
                    
                    if (this.type === 'high') {
                        this.width = 35;
                        this.height = 70;
                    } else if (this.type === 'normal') {
                        this.width = 40;
                        this.height = 50;
                    } else {
                        this.width = 45;
                        this.height = 30;
                    }
                    
                    this.x = canvas.width;
                    this.y = groundY - this.height;
                    this.speed = gameSpeed;
                    this.color = this.type === 'high' ? '#dc2626' : (this.type === 'normal' ? '#ef4444' : '#f59e0b');
                }
                
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // تفاصيل العقبة
                    ctx.fillStyle = this.type === 'high' ? '#b91c1c' : (this.type === 'normal' ? '#dc2626' : '#d97706');
                    
                    if (this.type === 'high') {
                        ctx.fillRect(this.x + 5, this.y + 5, this.width - 10, 8);
                        ctx.fillRect(this.x + 5, this.y + 20, this.width - 10, 8);
                        ctx.fillRect(this.x + 5, this.y + 35, this.width - 10, 8);
                    } else if (this.type === 'normal') {
                        ctx.fillRect(this.x + 5, this.y + 5, this.width - 10, 6);
                        ctx.fillRect(this.x + 5, this.y + 18, this.width - 10, 6);
                    } else {
                        ctx.fillRect(this.x + 5, this.y + 5, this.width - 10, 5);
                    }
                }
                
                update() {
                    this.x -= this.speed;
                }
            }
            
            // صنف العملات
            class Coin {
                constructor() {
                    this.radius = 12;
                    this.x = canvas.width + this.radius;
                    this.y = Math.random() * (groundY - 120) + 60;
                    this.speed = gameSpeed;
                    this.collected = false;
                    this.angle = 0;
                }
                
                draw() {
                    this.angle += 0.05;
                    const yOffset = Math.sin(this.angle) * 5;
                    
                    ctx.save();
                    ctx.translate(0, yOffset);
                    
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius - 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#fbbf24';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(this.x - 4, this.y - 4, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#d97706';
                    ctx.fill();
                    
                    ctx.restore();
                }
                
                update() {
                    this.x -= this.speed;
                    
                    // جذب العملة إذا كان المغناطيس نشطًا
                    if (upgrades.magnet) {
                        const dx = player.x + player.width/2 - this.x;
                        const dy = player.y + player.height/2 - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < upgrades.magnetRadius) {
                            this.x += dx * 0.1;
                            this.y += dy * 0.1;
                        }
                    }
                }
            }
            
            // صنف الطاقة
            class Powerup {
                constructor(type) {
                    this.type = type;
                    this.width = 35;
                    this.height = 35;
                    this.x = canvas.width;
                    this.y = Math.random() * (groundY - 120) + 60;
                    this.speed = gameSpeed;
                    this.collected = false;
                    this.angle = 0;
                    
                    switch(type) {
                        case 'shield':
                            this.color = '#3b82f6';
                            this.lightColor = '#60a5fa';
                            break;
                        case 'magnet':
                            this.color = '#ef4444';
                            this.lightColor = '#f87171';
                            break;
                        case 'rocket':
                            this.color = '#8b5cf6';
                            this.lightColor = '#a78bfa';
                            break;
                    }
                }
                
                draw() {
                    this.angle += 0.05;
                    const yOffset = Math.sin(this.angle) * 6;
                    
                    ctx.save();
                    ctx.translate(0, yOffset);
                    
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                    ctx.fill();
                    
                    ctx.fillStyle = this.lightColor;
                    ctx.beginPath();
                    ctx.roundRect(this.x + 5, this.y + 5, this.width - 10, this.height - 10, 5);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = '20px FontAwesome';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    if (this.type === 'shield') {
                        ctx.fillText('\f132', this.x + this.width/2, this.y + this.height/2);
                    } else if (this.type === 'magnet') {
                        ctx.fillText('\f076', this.x + this.width/2, this.y + this.height/2);
                    } else if (this.type === 'rocket') {
                        ctx.fillText('\f135', this.x + this.width/2, this.y + this.height/2);
                    }
                    
                    ctx.restore();
                }
                
                update() {
                    this.x -= this.speed;
                }
            }
            
            // صنف السحب
            class Cloud {
                constructor() {
                    this.x = canvas.width;
                    this.y = Math.random() * 120 + 20;
                    this.width = Math.random() * 80 + 60;
                    this.height = Math.random() * 25 + 20;
                    this.speed = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.3 + 0.5;
                }
                
                draw() {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.height, 0, Math.PI * 2);
                    ctx.arc(this.x + this.width * 0.3, this.y - this.height * 0.2, this.height * 0.8, 0, Math.PI * 2);
                    ctx.arc(this.x + this.width * 0.6, this.y, this.height, 0, Math.PI * 2);
                    ctx.arc(this.x + this.width * 0.8, this.y + this.height * 0.2, this.height * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                update() {
                    this.x -= this.speed;
                }
            }
            
            // صنف الجسيمات
            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 6 + 3;
                    this.speedX = Math.random() * 6 - 3;
                    this.speedY = Math.random() * 6 - 3;
                    this.color = color;
                    this.alpha = 1;
                    this.gravity = 0.05;
                }
                
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.speedY += this.gravity;
                    this.alpha -= 0.015;
                    this.size -= 0.1;
                }
            }
            
            // وظائف المساعدة
            function createParticles(x, y, amount, color) {
                for (let i = 0; i < amount; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }
            
            function showNotification(text) {
                upgradeNotification.textContent = text;
                upgradeNotification.classList.add('show');
                
                setTimeout(() => {
                    upgradeNotification.classList.remove('show');
                }, 2000);
            }
            
            function startCountdown() {
                return new Promise((resolve) => {
                    let count = 3;
                    countdown.textContent = count;
                    countdown.style.opacity = 1;
                    
                    const countdownInterval = setInterval(() => {
                        count--;
                        if (count > 0) {
                            countdown.textContent = count;
                            countdown.style.animation = 'none';
                            void countdown.offsetWidth;
                            countdown.style.animation = 'countdownAnimation 1s forwards';
                        } else {
                            clearInterval(countdownInterval);
                            countdown.textContent = 'GO!';
                            countdown.style.animation = 'none';
                            void countdown.offsetWidth;
                            countdown.style.animation = 'countdownAnimation 1s forwards';
                            
                            setTimeout(() => {
                                countdown.style.opacity = 0;
                                resolve();
                            }, 1000);
                        }
                    }, 1000);
                });
            }
            
            function startAutoRestartTimer() {
                let timeLeft = 5;
                restartTimerDisplay.textContent = timeLeft;
                
                if (autoRestartTimer) clearInterval(autoRestartTimer);
                
                autoRestartTimer = setInterval(() => {
                    timeLeft--;
                    restartTimerDisplay.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(autoRestartTimer);
                        restartGame();
                    }
                }, 1000);
            }
            
            // تهيئة اللعبة
            function initGame() {
                score = 0;
                coins = parseInt(localStorage.getItem('tmRunnerCoins') || '0');
                gameSpeed = 5 + (upgrades.speed ? 2 : 0);
                obstacles = [];
                coinsList = [];
                powerups = [];
                particles = [];
                clouds = [];
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.isJumping = false;
                player.jumps = upgrades.doubleJump ? 2 : 1;
                player.maxJumps = upgrades.doubleJump ? 2 : 1;
                player.hasShield = false;
                player.isInvincible = false;
                
                // إعادة تعيين أيقونات الطاقة
                document.getElementById('shield-powerup').classList.remove('active');
                document.getElementById('magnet-powerup').classList.remove('active');
                document.getElementById('rocket-powerup').classList.remove('active');
                
                // إنشاء بعض السحب الأولية
                for (let i = 0; i < 8; i++) {
                    clouds.push(new Cloud());
                    clouds[i].x = Math.random() * canvas.width;
                }
                
                updateScore();
                updateCoins();
                highScoreDisplay.textContent = highScore;
            }
            
            // رسم الخلفية والأرض
            function drawBackground() {
                // السماء
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#1e40af');
                gradient.addColorStop(0.5, '#3b82f6');
                gradient.addColorStop(1, '#60a5fa');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // الجبال البعيدة
                ctx.fillStyle = 'rgba(30, 41, 59, 0.6)';
                ctx.beginPath();
                ctx.moveTo(0, groundY - 100);
                ctx.lineTo(200, groundY - 200);
                ctx.lineTo(400, groundY - 150);
                ctx.lineTo(600, groundY - 220);
                ctx.lineTo(800, groundY - 170);
                ctx.lineTo(900, groundY - 120);
                ctx.lineTo(900, groundY);
                ctx.lineTo(0, groundY);
                ctx.closePath();
                ctx.fill();
                
                // الأرض
                ctx.fillStyle = '#84cc16';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
                
                // العشب
                ctx.fillStyle = '#65a30d';
                for (let i = 0; i < canvas.width; i += 20) {
                    ctx.fillRect(i, groundY, 8, -8);
                }
                
                // تفاصيل الأرض
                ctx.fillStyle = '#a3e635';
                for (let i = 0; i < canvas.width; i += 50) {
                    ctx.beginPath();
                    ctx.arc(i, groundY, 5, 0, Math.PI);
                    ctx.fill();
                }
            }
            
            // تحديث النقاط
            function updateScore() {
                scoreDisplay.textContent = score;
            }
            
            // تحديث العملات
            function updateCoins() {
                coinsDisplay.textContent = coins;
                localStorage.setItem('tmRunnerCoins', coins.toString());
            }
            
            // جمع العملة
            function collectCoin(coin) {
                coin.collected = true;
                coins += 1;
                updateCoins();
                
                // تأثير الجمع
                createParticles(coin.x, coin.y, 15, '#f59e0b');
                
                // عرض نص الجمع
                const collectText = document.createElement('div');
                collectText.className = 'collect-effect';
                collectText.textContent = '+1';
                collectText.style.left = coin.x + 'px';
                collectText.style.top = coin.y + 'px';
                document.getElementById('ui-overlay').appendChild(collectText);
                
                setTimeout(() => {
                    document.getElementById('ui-overlay').removeChild(collectText);
                }, 1000);
            }
            
            // جمع الطاقة
            function collectPowerup(powerup) {
                powerup.collected = true;
                
                // تفعيل الطاقة حسب النوع
                switch(powerup.type) {
                    case 'shield':
                        player.activateShield();
                        showNotification('Shield Activated!');
                        break;
                    case 'magnet':
                        player.activateMagnet();
                        showNotification('Magnet Activated!');
                        break;
                    case 'rocket':
                        player.activateRocket();
                        showNotification('Rocket Boost!');
                        break;
                }
                
                // تأثير الجمع
                createParticles(powerup.x + powerup.width/2, powerup.y + powerup.height/2, 20, powerup.color);
            }
            
            // التحقق من التصادم
            function checkCollision() {
                // مع العقبات
                for (let obstacle of obstacles) {
                    if (
                        player.x < obstacle.x + obstacle.width &&
                        player.x + player.width > obstacle.x &&
                        player.y < obstacle.y + obstacle.height &&
                        player.y + player.height > obstacle.y
                    ) {
                        if (player.isInvincible) {
                            // تدمير العقبة إذا كان اللاعب منيعًا
                            obstacle.x = -100;
                            createParticles(obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2, 25, '#ef4444');
                            score += 2;
                            updateScore();
                            return false;
                        } else if (player.hasShield) {
                            // كسر الدرع بدلاً من الخسارة
                            player.hasShield = false;
                            obstacle.x = -100;
                            document.getElementById('shield-powerup').classList.remove('active');
                            createParticles(player.x + player.width/2, player.y + player.height/2, 20, '#3b82f6');
                            showNotification('Shield Broken!');
                            return false;
                        } else {
                            return true;
                        }
                    }
                }
                
                // مع العملات
                for (let i = coinsList.length - 1; i >= 0; i--) {
                    const coin = coinsList[i];
                    const dx = player.x + player.width/2 - coin.x;
                    const dy = player.y + player.height/2 - coin.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < player.width/2 + coin.radius) {
                        collectCoin(coin);
                        coinsList.splice(i, 1);
                    }
                }
                
                // مع الطاقة
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const powerup = powerups[i];
                    const dx = player.x + player.width/2 - (powerup.x + powerup.width/2);
                    const dy = player.y + player.height/2 - (powerup.y + powerup.height/2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < player.width/2 + powerup.width/2) {
                        collectPowerup(powerup);
                        powerups.splice(i, 1);
                    }
                }
                
                return false;
            }
            
            // حلقة اللعبة الرئيسية
            function gameLoop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // رسم الخلفية
                drawBackground();
                
                // تحديث ورسم السحب
                for (let i = clouds.length - 1; i >= 0; i--) {
                    clouds[i].update();
                    clouds[i].draw();
                    
                    // إزالة السحب التي خرجت من الشاشة
                    if (clouds[i].x + clouds[i].width < 0) {
                        clouds.splice(i, 1);
                        clouds.push(new Cloud());
                    }
                }
                
                // تحديث ورسم الجسيمات
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    
                    // إزالة الجسيمات التي اختفت
                    if (particles[i].alpha <= 0 || particles[i].size <= 0) {
                        particles.splice(i, 1);
                    }
                }
                
                // تحديث ورسم اللاعب
                player.update();
                player.draw();
                
                // إنشاء عقبات جديدة
                if (Math.random() < 0.02) {
                    obstacles.push(new Obstacle());
                }
                
                // إنشاء عملات جديدة
                if (Math.random() < 0.03) {
                    coinsList.push(new Coin());
                }
                
                // إنشاء طاقة جديدة (نادرة)
                if (Math.random() < 0.006) {
                    const types = ['shield', 'magnet', 'rocket'];
                    const randomType = types[Math.floor(Math.random() * types.length)];
                    powerups.push(new Powerup(randomType));
                }
                
                // تحديث ورسم العقبات
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();
                    
                    // إزالة العقبات التي خرجت من الشاشة
                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                        score++;
                        updateScore();
                        
                        // زيادة صعوبة اللعبة كل 15 نقاط
                        if (score % 15 === 0) {
                            gameSpeed += 0.7;
                            showNotification('Speed Increased!');
                        }
                    }
                }
                
                // تحديث ورسم العملات
                for (let i = coinsList.length - 1; i >= 0; i--) {
                    coinsList[i].update();
                    coinsList[i].draw();
                    
                    // إزالة العملات التي خرجت من الشاشة
                    if (coinsList[i].x + coinsList[i].radius < 0) {
                        coinsList.splice(i, 1);
                    }
                }
                
                // تحديث ورسم الطاقة
                for (let i = powerups.length - 1; i >= 0; i--) {
                    powerups[i].update();
                    powerups[i].draw();
                    
                    // إزالة الطاقة التي خرجت من الشاشة
                    if (powerups[i].x + powerups[i].width < 0) {
                        powerups.splice(i, 1);
                    }
                }
                
                // التحقق من التصادم
                if (checkCollision()) {
                    gameOver();
                    return;
                }
                
                // استمرار اللعبة
                if (gameActive) {
                    animationId = requestAnimationFrame(gameLoop);
                }
            }
            
            // بدء اللعبة
            async function startGame() {
                initGame();
                startScreen.classList.add('hidden');
                
                // عد تنازلي قبل البدء
                await startCountdown();
                
                gameActive = true;
                gameLoop();
            }
            
            // نهاية اللعبة
            function gameOver() {
                gameActive = false;
                cancelAnimationFrame(animationId);
                
                // التحقق من تحقيق رقم قياسي جديد
                let isNewHighScore = false;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tmRunnerHighScore', highScore);
                    isNewHighScore = true;
                }
                
                finalScoreDisplay.textContent = score;
                finalCoinsDisplay.textContent = coins;
                newHighScoreDisplay.textContent = isNewHighScore ? 'Yes!' : 'No';
                
                gameOverScreen.classList.remove('hidden');
                
                // بدء عدّاد إعادة التشغيل التلقائي
                startAutoRestartTimer();
            }
            
            // إعادة اللعبة
            function restartGame() {
                if (autoRestartTimer) clearInterval(autoRestartTimer);
                gameOverScreen.classList.add('hidden');
                startGame();
            }
            
            // إضافة مستمعي الأحداث
            startButton.addEventListener('click', startGame);
            restartButton.addEventListener('click', restartGame);
            jumpBtn.addEventListener('click', () => {
                if (gameActive) player.jump();
            });
            
            // التحكم بالقفز بالمسافة أو السهم لأعلى
            document.addEventListener('keydown', (e) => {
                if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && gameActive) {
                    player.jump();
                    e.preventDefault();
                }
                
                // بدء اللعبة بالضغط على Space إذا كانت في شاشة البداية
                if (e.code === 'Space' && !gameActive && !startScreen.classList.contains('hidden')) {
                    startGame();
                }
            });
            
            // جعل اللعبة قابلة للعب على الهواتف بالنقر
            canvas.addEventListener('touchstart', (e) => {
                if (gameActive) {
                    player.jump();
                    e.preventDefault();
                } else if (!startScreen.classList.contains('hidden')) {
                    startGame();
                    e.preventDefault();
                }
            });
            
            canvas.addEventListener('mousedown', () => {
                if (gameActive) {
                    player.jump();
                } else if (!startScreen.classList.contains('hidden')) {
                    startGame();
                }
            });
            
            // ضبط حجم Canvas عند تغيير حجم النافذة
            function resizeGame() {
                const container = document.getElementById('game-container');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                groundY = canvas.height - 60;
                
                // إعادة ضبط موقع اللاعب
                player.y = groundY - player.height;
            }
            
            window.addEventListener('resize', resizeGame);
            
            // تهيئة اللعبة الأولى
            highScoreDisplay.textContent = highScore;
            
            // تحسين الأداء للهواتف
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (gameActive) player.jump();
                }, { passive: false });
            }
        });
    </script>
</body>
</html>
