<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahjong - tm crafts</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/favicon.png">
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      background-color: #111111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #3B82F6;
    }

    .logo-img {
      width: 200px;
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
    }

    .back-btn {
      display: inline-block;
      background-color: #3B82F6;
      color: #000000;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      margin: 10px;
      font-weight: bold;
    }

    .back-btn:hover {
      background-color: #FFFFFF;
      color: #3B82F6;
    }

    @media (max-width: 600px) {
      iframe {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.png" alt="tm crafts Logo" class="logo-img">
  </header>
  <div class="game-container">
    <iframe src="https://htmlgames.com/game/mahjong-classic/" frameborder="0"></iframe>
    <a href="/index.html" class="back-btn">العودة للرئيسية</a>
  </div>
</body>
</html>
